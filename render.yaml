services:
  - type: web
    name: safiya-toys
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: NODE_VERSION
        value: 24.8.0
      - key: SEED_PASSWORD
        sync: false
