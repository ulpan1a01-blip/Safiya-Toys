<html lang="ru">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Safiya Toys">
  <meta property="og:title" content="Safiya Toys — магазин игрушек в Туркестане">

    property="og:description"

  <meta property="og:image" content="https://safiya-toys.onrender.com/assets/images/SafiyaTpng2.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ToyStore",
    "name": "Safiya Toys",
    "url": "https://safiya-toys.onrender.com/",
    "logo": "https://safiya-toys.onrender.com/assets/images/SafiyaTpng2.png",

  <!-- Иконка сайта во вкладке браузера -->
  <link
    rel="icon"

  >

  <!-- Подключение CSS-стилей -->
  <link

    href="/frontend/styles.css"

<body>

  <!-- Шапка сайта.

  <header id="header"></header>

  <div id="layout">

    <!-- Боковое меню для продавца и курьера.

    <aside id="sidebar"></aside>


    <!-- Блок, в котором отображаются страницы сайта -->
    <main id="main" aria-live="polite">

      <!-- Текст виден поисковым системам до загрузки каталога -->
      <section class="empty">
        <h1>Магазин игрушек Safiya Toys в Туркестане</h1>
        <p>Детские игрушки в розницу и оптом: мягкие игрушки, машинки, куклы, конструкторы, развивающие игрушки и новинки.</p>
      </section>

    </main>

  </div>


  <!-- Нижняя часть сайта -->
  <footer id="footer">

    <!-- Логотип Safiya-Toys -->
    <img
      src="/assets/images/SafiyaTpng2.png"
      alt="Safiya-Toys"
    >

    <!-- Слоган магазина -->
    <p>ИГРУШКИ · СЧАСТЬЕ · РАЗВИТИЕ · ВМЕСТЕ</p>

    <!-- Дополнительный текст -->
    <span>Счастливые дети — счастливый мир</span>

    <!-- Instagram магазина -->
    <a
      class="instagram-link"
      href="https://www.instagram.com/safiya_toys_turkestan/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram Safiya Toys Turkestan"
    >
      <img
        src="/assets/images/instagram.png"
        alt="Instagram"
      >
      <span>@safiya_toys_turkestan</span>
    </a>

  </footer>


  <!-- Нижнее меню для мобильных устройств.
       Ссылки добавляются через JavaScript -->
  <nav
    id="bottom"
    aria-label="Навигация"
  ></nav>


  <!-- Модальное окно.
       Используется для форм, подтверждений и меню -->
  <dialog id="dialog">

    <!-- Кнопка закрытия модального окна -->
    <button
      class="close"
      data-action="close"
      aria-label="Закрыть"
    >
      Закрыть
    </button>

    <!-- Содержимое модального окна -->
    <div id="dialog-body"></div>

  </dialog>


  <!-- Небольшие уведомления для пользователя -->
  <div
    id="toast"
    role="status"
  ></div>


  <!-- Подключение главного JavaScript-файла -->
  <script
    type="module"
    src="/frontend/app.js?v=20260916-2"
  ></script>

</body>

</html>
